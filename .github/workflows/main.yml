name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - run: mise run lint
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - run: mise run test
  verify:
    name: CI result
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - run: echo "All checks passed"
  parallel-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - id: tests
        name: Run tests in background
        run: mise run test
        background: true
      - name: Run linter
        run: mise run lint
      - name: Wait for tests
        wait: tests
  server-demo:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - name: Start demo server
        id: server
        background: true
        run: mise run serve-demo
      - name: Wait for readiness
        run: curl --fail --retry 60 --retry-connrefused --retry-delay 1 --max-time 2 --retry-max-time 120 http://127.0.0.1:3000/
      - name: Check response
        run: test "$(curl --fail --silent http://127.0.0.1:3000/)" = wrong
      - name: Stop demo server
        cancel: server


