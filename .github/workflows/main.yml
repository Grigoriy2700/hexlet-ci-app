name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CHECK_LABEL: training

permissions:
  contents: read

jobs:

  inspect:
    runs-on: ubuntu-26.04
    env:
      DEBUG: "1"
    steps:
      - name: Show workflow values
        run: |
          printf '%s\n' "$CHECK_LABEL"
          printf '%s\n' "$GITHUB_WORKFLOW"
          printf '%s\n' "$DEBUG"
      - name: Show step value
        env:
          CHECK_LABEL: local-step
        run: printf '%s\n' "$CHECK_LABEL"
      - name: Show workflow value again
        run: printf '%s\n' "$CHECK_LABEL"
      - name: Show run information
        env:
          LABEL: ${{ vars.CI_LABEL || 'training' }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: printf '%s\n' "$LABEL" "$EVENT_NAME" "$WORKFLOW_NAME"
      - name: Manual run information
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo 'This step was requested manually'
      - name: Read repository name
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name'
      - name: Print PR title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE"

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - run: mise run lint

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            label: Ubuntu 24.04
          - os: ubuntu-26.04
            label: Ubuntu 26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - name: Test (${{ matrix.label }})
        run: mise run test
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-report-${{ matrix.os }}
          path: reports/test-results.xml
          retention-days: 7
          if-no-files-found: error
      - name: Explain failure
        if: ${{ failure() }}
        run: echo 'A check failed. Open the first failed step and inspect its log.'

  inspect-report:
    runs-on: ubuntu-26.04
    needs: test
    if: ${{ !cancelled() }}
    steps:
      - name: Download test reports
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: test-report-*
          path: reports

      - name: Verify non-empty XML
        run: |
          for file in reports/test-report-*/test-results.xml; do
            if [ ! -s "$file" ]; then
              echo "Error: $file is missing or empty"
              exit 1
            fi
            cat "$file"
          done

  verify:
    name: CI result
    runs-on: ubuntu-latest
    needs: [lint, test, inspect-report]
    steps:
      - run: echo "All checks passed"

  parallel-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - id: tests
        name: Run tests in background
        run: mise run test
        background: true
      - name: Run linter
        run: mise run lint
      - name: Wait for tests
        wait: tests

  server-demo:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - name: Start demo server
        id: server
        background: true
        run: mise run serve-demo
      - name: Wait for readiness
        run: curl --fail --retry 60 --retry-connrefused --retry-delay 1 --max-time 2 --retry-max-time 120 http://127.0.0.1:3000/
      - name: Check response
        run: test "$(curl --fail --silent http://127.0.0.1:3000/)" = ready
      - name: Stop demo server
        cancel: server
