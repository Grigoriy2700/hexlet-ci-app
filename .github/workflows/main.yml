name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - run: mise run lint
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - run: mise run lint
  verify:
    name: CI result
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - run: echo "All checks passed"
  parallel-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: jdx/mise-action@v2.4.4
      - run: mise run setup
      - parallel:
          - name: Lint
            run: mise run lint
          - name: Test
            run: mise run test
